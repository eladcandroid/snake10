<html>
<head><title>Snake</title></head>
<body>
<canvas id="game" width="400" height="400" style="border:1px solid #000"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let snake = [{x: 200, y: 200}];
let dx = 20, dy = 0;
let food = {x: 100, y: 100};

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = 'green';
  snake.forEach(part => ctx.fillRect(part.x, part.y, 20, 20));
  ctx.font = '20px Arial';
  ctx.fillText('🍎', food.x, food.y + 18);
}

function update() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(part => part.x === head.x && part.y === head.y)) {
    alert('Game Over!');
    snake = [{x: 200, y: 200}];
    dx = 20; dy = 0;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    food = {x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20};
  } else {
    snake.pop();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -20; }
  if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 20; }
  if (e.key === 'ArrowLeft' && dx === 0) { dx = -20; dy = 0; }
  if (e.key === 'ArrowRight' && dx === 0) { dx = 20; dy = 0; }
});

setInterval(() => { update(); draw(); }, 200);
draw();
</script>
</body>
</html>
